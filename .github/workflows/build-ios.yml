name: Build iOS IPA (unsigned)

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v4.2.0-ios). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project DashLens.xcodeproj \
            -scheme DashLens \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          VER=$(awk -F'"' '/MARKETING_VERSION/ {print $2; exit}' project.yml)
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DashLens.app Payload/
          zip -qry "DashLens-$VER-unsigned.ipa" Payload
          cp "DashLens-$VER-unsigned.ipa" DashLens-unsigned.ipa
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: DashLens-iOS-ipa
          path: |
            DashLens-*-unsigned.ipa
            DashLens-unsigned.ipa

      - name: Keep the build log if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release assets
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shasum -a 256 "DashLens-$VER-unsigned.ipa" DashLens-unsigned.ipa > SHA256SUMS.txt
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "DashLens for iPhone $TAG" --generate-notes
          gh release upload "$TAG" "DashLens-$VER-unsigned.ipa" DashLens-unsigned.ipa SHA256SUMS.txt TESTER-GUIDE.md --clobber
